<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assessments</title>
  <style>
    :root { --bg:#f6f7f9; --card:#fff; --text:#1f2933; --muted:#616e7c; --accent:#2563eb; --border:#e4e7eb; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--text); line-height:1.5; }
    main { max-width:760px; margin:0 auto; padding:40px 16px; }
    .back { color:var(--accent); text-decoration:none; font-size:.9rem; }
    .back:hover { text-decoration:underline; }
    h1 { margin:12px 0 4px; font-size:2rem; }
    .intro { color:var(--muted); margin:0 0 28px; }
    .card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:8px 24px; }
    ul { list-style:none; margin:0; padding:0; }
    li + li { border-top:1px solid var(--border); }
    li a { display:flex; justify-content:space-between; align-items:center; gap:12px; padding:14px 4px; color:var(--text); text-decoration:none; }
    li a:hover .code { color:var(--accent); text-decoration:underline; }
    .code { font-weight:600; }
    .name { color:var(--muted); }
    .arrow { color:var(--accent); }
    footer { margin-top:40px; color:var(--muted); font-size:.875rem; text-align:center; }
  </style>
</head>
<body>
  <main>
    
    <h1>Assessments</h1>
    <p class="intro">Choose your course.</p>
    <section class="card">
      <ul>
        <!-- To add a course: copy one li block and change the folder path and name -->
        <li>
          <a href="22636VIC_Initial EAL/">
            <span><span class="code">22636VIC</span> <span class="name">Initial EAL</span></span>
            <span class="arrow">→</span>
          </a>
        </li>
        <li>
          <a href="22637VIC_EAL/">
            <span><span class="code">22637VIC</span> <span class="name">EAL</span></span>
            <span class="arrow">→</span>
          </a>
        </li>
        <li>
          <a href="22638VIC_EAL_1/">
            <span><span class="code">22638VIC</span> <span class="name">EAL 1</span></span>
            <span class="arrow">→</span>
          </a>
        </li>
        <li>
          <a href="22639VIC_EAL_2/">
            <span><span class="code">22639VIC</span> <span class="name">EAL 2</span></span>
            <span class="arrow">→</span>
          </a>
        </li>
        <li>
          <a href="22640VIC_EAL_3/">
            <span><span class="code">22640VIC</span> <span class="name">EAL 3</span></span>
            <span class="arrow">→</span>
          </a>
        </li>
      </ul>
    </section>
    <footer>Gr8Teachers</footer>
  </main>
</body>
</html>
