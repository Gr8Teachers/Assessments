<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assessments</title>
  <style>
    :root { --bg:#f6f7f9; --card:#fff; --text:#1f2933; --muted:#616e7c; --accent:#2563eb; --border:#e4e7eb; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--text); line-height:1.5; }
    main { max-width:760px; margin:0 auto; padding:40px 16px; }
    .back { color:var(--accent); text-decoration:none; font-size:.9rem; }
    .back:hover { text-decoration:underline; }
    h1 { margin:12px 0 4px; font-size:2rem; }
    .intro { color:var(--muted); margin:0 0 28px; }
    .card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:8px 24px; }
    ul { list-style:none; margin:0; padding:0; }
    li + li { border-top:1px solid var(--border); }
    li a { display:flex; justify-content:space-between; align-items:center; gap:12px; padding:14px 4px; color:var(--text); text-decoration:none; }
    li a:hover .code { color:var(--accent); text-decoration:underline; }
    .code { font-weight:600; }
    .name { color:var(--muted); }
    .arrow { color:var(--accent); }
    footer { margin-top:40px; color:var(--muted); font-size:.875rem; text-align:center; }
    .tiles { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
    .tile { display:block; background:var(--card); border:1px solid var(--border); border-radius:12px; padding:28px 24px; color:var(--text); text-decoration:none; }
    .tile:hover { border-color:var(--accent); box-shadow:0 2px 8px rgba(37,99,235,.12); }
    .tile .t { font-size:1.6rem; font-weight:700; display:flex; justify-content:space-between; align-items:center; }
    .tile .t span { color:var(--accent); font-weight:400; }
    .tile .d { color:var(--muted); margin-top:6px; font-size:.95rem; }
    @media (max-width:520px) { .tiles { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <main>
    <h1>Assessments</h1>
    <p class="intro">Choose EAL or ESOL.</p>
    <section class="tiles">
      <a class="tile" href="EAL/"><div class="t">EAL <span>→</span></div><div class="d">22636VIC, 22637VIC, 22638VIC, 22639VIC, 22640VIC</div></a>
      <a class="tile" href="ESOL/"><div class="t">ESOL <span>→</span></div><div class="d">10982NAT FESOL, 11022NAT EFS</div></a>
    </section>
    <footer>Gr8Teachers</footer>
  </main>
</body>
</html>
